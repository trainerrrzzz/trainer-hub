org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# API base URL per build type (spec #34). Debug: the local web server, seen from the emulator as 10.0.2.2. Override it
# for a preview or a phone on the LAN: ./gradlew installDebug -Pfivvi.apiBaseUrl=https://<preview>/api/
fivvi.apiBaseUrl=http://10.0.2.2:3000/api/
# Release: the production API over HTTPS (docs/engineering/ENVIRONMENTS.md, "Production address"). checkReleaseApiBaseUrl
# (pnpm test:android, every release build) fails on an empty, plain-HTTP or .invalid address.
fivvi.releaseApiBaseUrl=https://web-production-d3fe2.up.railway.app/api/
# The build number (versionCode) of a release run is passed from outside, -Pfivvi.buildNumber=<n>; without it the
# default of apps/Version.xcconfig (1) applies, as in debug builds and CI. The version (versionName) comes from that file.
# Sentry DSN per build type (E009, OBSERVABILITY.md §1 "Android"). Empty means no crash reporting. Debug stays empty
# unless you set it for a test: ./gradlew installDebug -Pfivvi.sentryDsn=https://<key>@<org>.ingest.de.sentry.io/<id>
# Release: the DSN of the Sentry project `android` (#85). Not a secret: it only sends events and ships inside the app.
# checkReleaseSentryDsn (pnpm test:android, every release build) fails unless its host is <org>.ingest.de.sentry.io.
fivvi.sentryDsn=
fivvi.releaseSentryDsn=https://99ef5ce23b1230c87868eefd45527ded@o4512131315531776.ingest.de.sentry.io/4512266384638032
